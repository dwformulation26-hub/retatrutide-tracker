<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Incretin LAI Radar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Same system as the Presbyopia, Intranasal and Tirzepatide Radars: page 1 = stage lanes of product cards, page 2 = patent landscape,
   page 3 = the originator's patent clock and plan, page 4 = dated news list */
:root {
  --bg: #f5f5f8; --surface: #ffffff; --ink: #15151d; --ink-2: #4a4a5a; --muted: #7c7c8c; --line: #e0e0e8; --line-2: #cbcbd8;
  --accent: #4b4a9a; --accent-soft: #ebeaf6; --accent-ink: #3a3982; --on-accent: #ffffff;
  --ok: #1d7f47; --ok-soft: #e3f3e8; --warn: #9a6512; --warn-soft: #fbf0dc; --crit: #b23a30; --crit-soft: #fbe7e4;
  --lane-1: #3a3982; --lane-2: #5b5ab0; --lane-3: #9897cf; --lane-4: #b9bcc4;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4;
  --sans: "IBM Plex Sans", "IBM Plex Sans KR", system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f0f15; --surface: #17171f; --ink: #ebebf2; --ink-2: #b6b6c6; --muted: #82828f; --line: #272733; --line-2: #363645;
    --accent: #a6a5ea; --accent-soft: #23234a; --accent-ink: #c4c3f3; --on-accent: #15151d;
    --ok: #4cc27f; --ok-soft: #143222; --warn: #e2a64a; --warn-soft: #33270f; --crit: #ef7a6e; --crit-soft: #3a1c19;
    --lane-1: #c4c3f3; --lane-2: #8f8ee0; --lane-3: #5e5db0; --lane-4: #4a4d55;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f0f15; --surface: #17171f; --ink: #ebebf2; --ink-2: #b6b6c6; --muted: #82828f; --line: #272733; --line-2: #363645;
  --accent: #a6a5ea; --accent-soft: #23234a; --accent-ink: #c4c3f3; --on-accent: #15151d;
  --ok: #4cc27f; --ok-soft: #143222; --warn: #e2a64a; --warn-soft: #33270f; --crit: #ef7a6e; --crit-soft: #3a1c19;
  --lane-1: #c4c3f3; --lane-2: #8f8ee0; --lane-3: #5e5db0; --lane-4: #4a4d55;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--sans); }
a { color: var(--accent-ink); text-decoration: none; }
a:hover { text-decoration: underline; }
a:focus-visible, button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.mono { font-family: var(--mono); font-size: .86em; letter-spacing: -.01em; }
.muted { color: var(--muted); }
.ko { display: block; color: var(--ink-2); font-size: .94em; }
.ko-inline { color: var(--ink-2); margin-left: .4em; font-weight: 400; }
:root[data-lang="en"] .ko, :root[data-lang="en"] .ko-inline { display: none; }
:root[data-lang="ko"] .en { display: none; }
:root[data-lang="ko"] .ko { color: inherit; font-size: inherit; }
:root[data-lang="ko"] .ko-inline { color: inherit; margin-left: 0; }
:root[data-lang="ko"] body, :root[data-lang="both"] body { word-break: keep-all; }

/* header: brand mark, underline tabs, pill language switch */
.top { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter: saturate(1.4) blur(10px); -webkit-backdrop-filter: saturate(1.4) blur(10px); border-bottom: 1px solid var(--line); }
.top-in { display: flex; align-items: center; gap: 4px 20px; min-height: 64px; flex-wrap: wrap; }
.name { display: flex; align-items: center; gap: 12px; margin-right: auto; min-width: 0; }
.mark { width: 34px; height: 34px; flex: none; border-radius: 10px; display: grid; place-items: center; background: linear-gradient(135deg, var(--lane-2), var(--lane-1)); box-shadow: 0 1px 2px rgb(0 0 0 / .12), inset 0 1px 0 rgb(255 255 255 / .18); }
.mark svg { width: 20px; height: 20px; }
.name .t { font-size: 15.5px; font-weight: 650; letter-spacing: -.015em; line-height: 1.2; white-space: nowrap; }
.name small { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); line-height: 1.3; margin-top: 2px; white-space: nowrap; }
.name small::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); flex: none; }
nav { display: flex; gap: 4px; align-self: stretch; scrollbar-width: none; }
nav::-webkit-scrollbar { display: none; }
nav a { position: relative; display: flex; align-items: center; padding: 0 12px; color: var(--muted); font-size: 14px; font-weight: 500; white-space: nowrap; transition: color .15s; }
nav a::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: -1px; height: 2px; border-radius: 2px 2px 0 0; background: var(--accent); transform: scaleX(0); transition: transform .2s; }
nav a:hover { color: var(--ink); text-decoration: none; }
nav a[aria-current="page"] { color: var(--ink); font-weight: 600; }
nav a[aria-current="page"]::after { transform: scaleX(1); }
/* tabs show one language: English unless the page is in Korean */
nav .ko-inline { margin-left: 0; }
:root:not([data-lang="ko"]) nav .ko-inline { display: none; }
:root[data-lang="ko"] nav .en { display: none; }
.drug { display: inline-flex; padding: 3px; gap: 2px; background: var(--accent-soft); border-radius: 999px; }
.drug button { border: 0; background: none; color: var(--accent-ink); font: 600 12.5px var(--sans); padding: 5px 12px; border-radius: 999px; cursor: pointer; }
.drug button[aria-pressed="true"] { background: var(--accent); color: var(--surface); }
.lang { display: inline-flex; padding: 3px; gap: 2px; background: var(--bg); border: 1px solid var(--line); border-radius: 999px; }
.lang button { border: 0; background: none; color: var(--muted); font: 600 12px var(--sans); padding: 5px 11px; border-radius: 999px; cursor: pointer; transition: background .15s, color .15s; }
.lang button:hover { color: var(--ink); }
.lang button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .1), 0 0 0 1px var(--line); }
@media (max-width: 760px) {
  .top-in { gap: 0 12px; padding-top: 10px; }
  nav { order: 3; width: 100%; overflow-x: auto; min-height: 44px; margin-top: 4px; }
  nav a { padding: 0 10px; } nav a::after { left: 10px; right: 10px; }
  nav a:first-child { padding-left: 0; } nav a:first-child::after { left: 0; }
  .name { flex: 1 1 0; gap: 10px; } .name > div { min-width: 0; }
  .name .t { overflow: hidden; text-overflow: ellipsis; font-size: 15px; }
  .mark { width: 30px; height: 30px; border-radius: 9px; } .mark svg { width: 18px; height: 18px; }
  .lang button { padding: 4px 8px; font-size: 11.5px; }
  .drug { order: 2; flex: 1 1 100%; margin-top: 8px; } .drug button { flex: 1; padding: 6px 14px; }
}
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; background: var(--surface); color: var(--ink-2); font: inherit; font-size: 12.5px; padding: 5px 10px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line-2); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.seg button[aria-pressed="true"] .ko-inline { color: inherit; }
@media (max-width: 760px) { nav { order: 3; width: 100%; overflow-x: auto; } nav a { padding: 7px 10px; } .top-in { gap: 8px 12px; } .name { min-width: 0; } }

main { padding-block: 32px 56px; }
h1 { font-size: clamp(24px, 3.2vw, 32px); line-height: 1.2; letter-spacing: -.02em; margin: 0; font-weight: 650; text-wrap: balance; }
h1 .ko { font-size: .62em; font-weight: 500; margin-top: 6px; letter-spacing: 0; }
:root[data-lang="ko"] h1 .ko { font-size: 1em; font-weight: 650; margin-top: 0; }
h2 { font-size: 18px; letter-spacing: -.01em; margin: 0; font-weight: 650; }
h2 .ko-inline { font-size: .85em; }
h3 { margin: 0; }
.lede { color: var(--ink-2); margin: 12px 0 0; }
.eyebrow { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-bottom: 8px; letter-spacing: .02em; }
.stack { display: grid; gap: 36px; grid-template-columns: minmax(0, 1fr); }
.stack > *, .lane > * { min-width: 0; }

/* page 1: stage strip */
.strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; margin-top: 22px; }
.strip a { display: grid; gap: 2px; padding: 10px 12px 9px; background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--c); border-radius: 6px; color: var(--ink); }
.strip a:hover { text-decoration: none; border-color: var(--line-2); border-top-color: var(--c); }
.strip .n { font-size: 24px; font-weight: 650; line-height: 1.1; font-variant-numeric: tabular-nums; }
.strip .l { font-size: 12.5px; color: var(--ink-2); line-height: 1.3; }
@media (max-width: 760px) { .strip { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-top: 18px; }
.tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--muted); }
.sel { font: inherit; font-size: 12.5px; color: var(--ink); background: var(--surface); border: 1px solid var(--line-2); border-radius: 8px; padding: 5px 8px; max-width: 100%; }

/* registries checked: why the first lane is empty */
.reg { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 8px; margin-top: 14px; }
.reg div { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; font-size: 12.5px; color: var(--ink-2); display: grid; gap: 2px; align-content: start; }
.reg b { font-size: 13px; color: var(--ink); display: flex; gap: 8px; align-items: baseline; }

/* technology × stage matrix */
.mx-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; margin-top: 14px; }
.mx { width: 100%; border-collapse: collapse; font-size: 13px; }
.mx th, .mx td { padding: 7px 10px; border-bottom: 1px solid var(--line); text-align: center; white-space: nowrap; }
.mx th:first-child, .mx td:first-child { text-align: left; }
.mx thead th { font-size: 11.5px; font-weight: 600; color: var(--muted); border-bottom: 1px solid var(--line-2); vertical-align: bottom; }
.mx thead th .ko { font-weight: 500; font-size: 11px; }
.mx tbody tr:last-child td { border-bottom: 0; }
.mx td.c button { font: 600 13px var(--mono); border: 0; background: none; color: var(--ink); cursor: pointer; padding: 2px 8px; border-radius: 6px; min-width: 32px; }
.mx td.c button:hover { background: var(--accent-soft); color: var(--accent-ink); }
.mx td.z { color: var(--line-2); font-family: var(--mono); }
.mx td.tot { font-family: var(--mono); color: var(--muted); }
.mx tr.on td { background: var(--accent-soft); }

.lane { display: grid; gap: 12px; scroll-margin-top: 90px; grid-template-columns: minmax(0, 1fr); }
.lane-h { display: flex; align-items: baseline; gap: 10px; border-bottom: 2px solid var(--c); padding-bottom: 8px; }
.lane-h .count { font-family: var(--mono); font-size: 13px; color: var(--muted); margin-left: auto; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 10px; align-content: start; min-width: 0; overflow-wrap: anywhere; }
.card-h { display: flex; gap: 10px; min-width: 0; align-items: flex-start; justify-content: space-between; }
.card-h > div { min-width: 0; }
.co { font-size: 13px; color: var(--ink-2); line-height: 1.35; }
.co .ko { font-size: 12.5px; color: var(--muted); }
.prod { font-size: 17px; font-weight: 650; letter-spacing: -.01em; line-height: 1.3; margin: 2px 0 0; }
.prod .ko { font-size: 14px; font-weight: 500; margin-top: 1px; }
:root[data-lang="ko"] .co .ko { font-size: inherit; color: inherit; }
:root[data-lang="ko"] .prod .ko { font-size: inherit; font-weight: inherit; }
.api { font-size: 13px; color: var(--muted); line-height: 1.45; }
.flag { font-family: var(--mono); font-size: 11px; font-weight: 500; padding: 2px 6px; border-radius: 4px; border: 1px solid var(--line-2); color: var(--ink-2); flex: none; }
.flag.kr { background: var(--accent-soft); border-color: transparent; color: var(--accent-ink); }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.stage { font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--bg); color: var(--ink-2); line-height: 1.5; }
.area { font-size: 11.5px; font-weight: 500; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line-2); color: var(--ink-2); line-height: 1.5; }
.fresh { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); line-height: 1.5; }
.fresh.new { background: var(--ok-soft); color: var(--ok); }
.row { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 10px; font-size: 13.5px; border-top: 1px solid var(--line); padding-top: 10px; min-width: 0; }
.lbl { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding-top: 2px; line-height: 1.3; }
.lbl .ko { display: block; font-size: 11.5px; letter-spacing: 0; text-transform: none; color: var(--muted); font-weight: 500; }
:root[data-lang="ko"] .lbl .ko { font-size: 12px; }
.now { color: var(--ink); }
.ivl { font-weight: 600; }
.trials { display: grid; gap: 6px; min-width: 0; }
.trial { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 12.5px; color: var(--ink-2); }
.trial a { font-family: var(--mono); font-size: 12px; }
.trial .meta { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
.st { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; }
.st.done { background: var(--bg); color: var(--ink-2); }
.st.go { background: var(--ok-soft); color: var(--ok); }
.st.stop { background: var(--crit-soft); color: var(--crit); }
.st.unk { background: var(--warn-soft); color: var(--warn); }
.pat { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12.5px; color: var(--ink-2); }
.pat a { font-family: var(--mono); font-size: 12px; }
.dev { color: var(--ink-2); }
.srcl { font-size: 12px; }
.stopped > summary { cursor: pointer; list-style: none; }
.stopped > summary::-webkit-details-marker { display: none; }
.stopped .lane-h::after { content: "+"; font-family: var(--mono); color: var(--muted); }
.stopped[open] .lane-h::after { content: "–"; }
.stopped[open] .cards { margin-top: 12px; }
.empty { background: var(--surface); border: 1px dashed var(--line-2); border-radius: 10px; padding: 20px; color: var(--muted); text-align: center; }

/* page 2: patents */
.tbl-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th { text-align: left; font-size: 11.5px; font-weight: 600; color: var(--muted); padding: 10px 14px; border-bottom: 1px solid var(--line-2); white-space: nowrap; vertical-align: bottom; }
th .ko { font-weight: 500; font-size: 11px; }
td { padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.nowrap { white-space: nowrap; }
td .sub { display: block; color: var(--muted); font-size: 12px; font-family: var(--mono); }
.pt-tbl { min-width: 820px; }
.status { font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 999px; background: var(--bg); color: var(--ink-2); white-space: nowrap; display: inline-block; }
.status.granted { background: var(--ok-soft); color: var(--ok); }
.status.ceased { background: var(--crit-soft); color: var(--crit); }
.counts { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 150px), 1fr)); gap: 8px; margin-top: 18px; }
.counts div { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 2px; }
.counts .n { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; line-height: 1.1; }
.counts .l { font-size: 12.5px; color: var(--ink-2); }
.section-h { display: grid; gap: 4px; margin-bottom: 12px; }
.section-h p { margin: 0; color: var(--ink-2); font-size: 14px; }

/* page 3: key figures, a Gantt of the patent families on one shared year axis, then a year-by-year road map */
.kf { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); gap: 10px; margin-top: 22px; }
.kf div { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 2px; align-content: start; }
.kf .v { font-size: 26px; font-weight: 650; letter-spacing: -.02em; line-height: 1.15; font-variant-numeric: tabular-nums; }
.kf .v .ko { font-size: 14px; font-weight: 500; letter-spacing: 0; }
.kf .l { font-size: 13px; font-weight: 600; color: var(--ink); margin-top: 4px; }
.kf .s { font-size: 12.5px; color: var(--muted); line-height: 1.4; }
:root[data-lang="ko"] .kf .v .ko { font-size: inherit; font-weight: inherit; }
.gantt { --lw: 230px; --gap: 20px; --pad: 20px; position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 0 var(--pad) 6px; }
.gantt .grid { position: absolute; top: 0; bottom: 0; left: calc(var(--pad) + var(--lw) + var(--gap)); right: var(--pad); pointer-events: none; }
.gantt .grid i { position: absolute; top: 34px; bottom: 0; border-left: 1px solid var(--line); }
.gantt .grid b { position: absolute; top: 12px; transform: translateX(-50%); font: 500 11px var(--mono); color: var(--muted); }
.gantt .grid .now { border-left: 1.5px solid var(--crit); top: 30px; }
.gantt .grid .nowl { position: absolute; top: 12px; transform: translateX(-50%); font: 600 11px var(--mono); color: var(--crit); background: var(--surface); padding: 0 4px; white-space: nowrap; }
.gantt .head { height: 38px; }
.gr { position: relative; display: grid; grid-template-columns: var(--lw) minmax(0, 1fr); gap: 6px var(--gap); align-items: center; padding: 14px 0; border-top: 1px solid var(--line); }
.gr .lab { display: grid; gap: 1px; min-width: 0; position: relative; z-index: 1; }
.gr .gn { font-size: 14px; font-weight: 600; line-height: 1.3; }
.gr .gn .ko-inline { font-weight: 500; }
.gr .gm { font: 11.5px var(--mono); color: var(--muted); }
.gr .ge { font-size: 12.5px; color: var(--ink-2); }
.bar { position: relative; height: 12px; }
.bar .b { position: absolute; top: 0; bottom: 0; border-radius: 4px; background: var(--k); }
.bar .x { position: absolute; top: 0; bottom: 0; border: 1.5px dashed var(--k); border-left: 0; border-radius: 0 4px 4px 0; }
.gkey { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 12px; color: var(--muted); padding: 12px 0 8px; border-top: 1px solid var(--line); position: relative; z-index: 1; background: var(--surface); }
.gkey i { display: inline-block; width: 18px; height: 8px; border-radius: 3px; background: var(--k); margin-right: 6px; vertical-align: middle; }
.gkey i.dash { background: none; border: 1.5px dashed var(--lane-1); border-left: 0; }
.gkey i.tdk { width: 0; height: 12px; border-left: 1.5px solid var(--crit); border-radius: 0; }
@media (max-width: 620px) {
  .gantt { --lw: 0px; --gap: 0px; --pad: 16px; }
  .gr { grid-template-columns: minmax(0, 1fr); }
  .gr .lab { background: var(--surface); padding-bottom: 2px; }
}
.road { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.yr { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 6px 20px; padding: 18px 20px 4px; border-top: 1px solid var(--line); }
.yr:first-child { border-top: 0; }

<script>
"use strict";
// the drug comes from the hash (#cagri/pk); bare page hashes (#pk) stay on retatrutide so old links keep working
const DRUGS = window.DRUGS;
let DRUG = "reta", D = DRUGS.reta;
const cap = (x) => x[0].toUpperCase() + x.slice(1);
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
// bilingual text: block (two lines) or inline
const T = (o) => (o && typeof o === "object" ? `<span class="en">${o.en}</span>${o.ko && o.ko !== o.en ? `<span class="ko">${o.ko}</span>` : ""}` : o ?? "");
const Ti = (en, ko) => `<span class="en">${en}</span><span class="ko-inline">${ko}</span>`;
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const segHtml = (id, cur, opts) => `<div class="seg" id="${id}" role="group">${opts.map(([v, en, ko]) =>
  `<button type="button" data-v="${v}" aria-pressed="${cur === v}">${Ti(en, ko)}</button>`).join("")}</div>`;
const fill = (o, v) => ({ en: o.en.replace(/\{(\w+)\}/g, (_, k) => v[k]), ko: o.ko.replace(/\{(\w+)\}/g, (_, k) => v[k]) });
// Google Patents by default; patentLinks overrides numbers it cannot show (404, or a machine translation that hides the drug name)
const patUrl = (no) => (D.patentLinks || {})[no] || `https://patents.google.com/patent/${encodeURIComponent(no)}/en`;

// ── language ────────────────────────────────────────────────────
function setLang(l) {
  document.documentElement.dataset.lang = l;
  document.documentElement.lang = l === "ko" ? "ko" : "en";
  document.querySelectorAll("#lang button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.l === l));
  try { localStorage.setItem("reta-lang", l); } catch (e) { /* storage unavailable */ }
}
let saved = null; try { saved = localStorage.getItem("reta-lang"); } catch (e) { /* storage unavailable */ }
setLang(["both", "en", "ko"].includes(saved) ? saved : "both");
$("#lang").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) setLang(b.dataset.l); });

// ═════════ PAGE 1 — COMPETITORS ═════════
const LANE_C = { clinic: "--lane-1", animal: "--lane-2", patent: "--lane-3", stopped: "--lane-4" };
const ST = {
  COMPLETED: ["done", "Completed", "완료"], RECRUITING: ["go", "Recruiting", "모집 중"], ACTIVE_NOT_RECRUITING: ["go", "Active", "진행 중"],
  NOT_YET_RECRUITING: ["go", "Not yet recruiting", "모집 전"], ENROLLING_BY_INVITATION: ["go", "Enrolling by invitation", "초청 모집"],
  TERMINATED: ["stop", "Terminated", "조기 종료"], WITHDRAWN: ["stop", "Withdrawn", "철회"], SUSPENDED: ["stop", "Suspended", "일시 중지"],
  UNKNOWN: ["unk", "Status unknown", "상태 불명"],
};
let scope = "All", tech = "All";

function trialHtml(c) {
  if (!c.trials.length) return `<span class="muted">${T(c.noTrial) || Ti("No registered trial found", "등록 임상 확인 안 됨")}</span>`;
  return c.trials.slice(0, 3).map((t) => {
    const [cls, en, ko] = ST[t.status] || ["unk", t.status, t.status];
    return `<div class="trial"><a href="https://clinicaltrials.gov/study/${t.nct}" target="_blank" rel="noopener">${t.nct}</a>
      <span class="st ${cls}">${Ti(en, ko)}</span><span class="meta">${t.phase || ""} · n=${t.n ?? "?"}${t.pcd ? " · " + String(t.pcd).slice(0, 7) : ""}</span></div>`;
  }).join("") + (c.noTrial ? `<div class="muted" style="font-size:12px">${T(c.noTrial)}</div>` : "");
}
const patHtml = (c) => c.patents.length
  ? `<div class="pat">${c.patents.map((p) => `<span><a href="${patUrl(p.no)}" target="_blank" rel="noopener">${p.no}</a> ${Ti(p.status.en, p.status.ko)}</span>`).join("")}</div>`

// "New" for cards added in the last 30 days, "Updated" for a card change in the last 14 days
const daysAgo = (d) => (new Date(D.asOf) - new Date(d)) / 864e5;
function badge(c) {
  if (c.added && daysAgo(c.added) <= 30) return `<span class="fresh new">${Ti("New", "신규")}</span>`;
  const last = (c.history || []).map((h) => h.date).sort().pop();
  return last && daysAgo(last) <= 14 ? `<span class="fresh">${Ti("Updated", "업데이트")}</span>` : "";
}

// ═════════ PAGE 3 — PATENT HOLDER'S TIMELINE ═════════
const yr = (d) => { const [y, m = 1, dd = 15] = String(d).split("-").map(Number); return y + (m - 1) / 12 + (dd - 1) / 365; };
const ym = (d) => { const [y, m] = String(d).split("-"); return m ? Ti(`${MONTHS[+m - 1]} ${y}`, `${y}년 ${+m}월`) : y; };
function renderTimeline() {
  const el = $("#p-timeline");
  const E = [...D.estate].sort((a, b) => a.priority.localeCompare(b.priority));
  const y0 = Math.floor(Math.min(...E.map((p) => yr(p.priority))));
  const y1 = Math.ceil(Math.max(...E.flatMap((p) => [yr(p.extMax || p.expiry), yr(p.expiry)]))) + 1;
  const pct = (d) => (((typeof d === "number" ? d : yr(d)) - y0) / (y1 - y0) * 100);
  const ticks = []; for (let y = Math.ceil(y0 / 5) * 5; y < y1; y += 5) ticks.push(y);
  // the molecule patent carries the story; later families are drawn quieter
  const col = (p) => (p.kind === "compound" ? "--lane-1" : "--lane-3");
  const gantt = `<div class="gantt" role="img" aria-label="${esc(`${cap(D.meta.name.en)} patent families from priority date to expiry`)}">
    <div class="grid">${ticks.map((y) => `<i style="left:${pct(y)}%"></i>${Math.abs(pct(y) - pct(D.asOf)) < 8 ? "" : `<b style="left:${pct(y)}%">${y}</b>`}`).join("")}
      <i class="now" style="left:${pct(D.asOf)}%"></i><span class="nowl" style="left:${pct(D.asOf)}%">${Ti("Today", "오늘")}</span></div>
    <div class="head"></div>
    ${E.map((p) => `<div class="gr" style="--k:var(${col(p)})" title="${esc(p.note.en)}">
      <div class="lab"><div class="gn">${Ti(p.short.en, p.short.ko)}</div>
        <div class="ge">${Ti("Expires", "만료")} <b class="mono">${p.expiry.slice(0, 7)}</b>${p.extMax ? `<span class="muted"> · ${Ti("extended", "연장 시")} <span class="mono">≤ ${p.extMax.slice(0, 7)}</span></span>` : ""}</div>
        <a class="gm" href="${patUrl(p.no)}" target="_blank" rel="noopener">${p.no}</a></div>
      <div class="bar"><span class="b" style="left:${pct(p.priority)}%;width:${pct(p.expiry) - pct(p.priority)}%"></span>${p.extMax ? `<span class="x" style="left:calc(${pct(p.expiry)}% - 4px);width:calc(${pct(p.extMax) - pct(p.expiry)}% + 4px)"></span>` : ""}</div>
    </div>`).join("")}
    <div class="gkey"><span style="--k:var(--lane-1)"><i></i>${Ti("Molecule patent", "물질 특허")}</span><span style="--k:var(--lane-3)"><i></i>${Ti(`Later ${D.meta.originator.en} patents`, `${D.meta.originator.ko} 후속 특허`)}</span>
      <span><i class="dash"></i>${Ti("Possible extension (estimate)", "연장 가능 기간(추정)")}</span><span><i class="tdk"></i>${Ti("Today", "오늘")}</span></div>
  </div>`;
  const table = `<details class="dtl"><summary>${Ti("Patent details", "특허 상세")}</summary><div class="tbl-wrap"><table class="pt-tbl"><thead><tr>
      <th>${T({ en: "Patent", ko: "특허" })}</th><th>${T({ en: "What it covers", ko: "보호 대상" })}</th><th>${T({ en: "Granted", ko: "등록" })}</th><th>${T({ en: "Priority", ko: "우선일" })}</th><th>${T({ en: "Expires", ko: "만료" })}</th></tr></thead><tbody>
    ${E.map((p) => `<tr><td class="nowrap"><a class="mono" href="${patUrl(p.no)}" target="_blank" rel="noopener">${p.no}</a></td><td>${T(p.title)}</td>
      <td>${T(p.granted)}</td><td class="nowrap mono">${p.priority}</td><td class="nowrap mono">${p.expiry}${p.extMax ? `<span class="sub">≤ ${p.extMax}</span>` : ""}</td></tr>`).join("")}
  </tbody></table></div></details>`;
  // road map: one block per year, with a Today rule before the first planned step
  const M = [...D.plan].sort((a, b) => a.date.localeCompare(b.date));
  const years = [...new Set(M.map((m) => m.date.slice(0, 4)))];
  let crossed = false;
  const road = years.map((y) => {
    const evs = M.filter((m) => m.date.startsWith(y));
    const body = evs.map((m) => {
      const rule = !crossed && !m.done ? (crossed = true, `<div class="today">${Ti("Today", "오늘")} · ${D.asOf}</div>`) : "";
      return `${rule}<div class="ev${m.done ? "" : " plan"}"><span class="dot"></span>
        <div class="when"><span>${m.date}</span>${m.done ? "" : `<span class="st plan">${Ti("Planned", "계획")}</span>`}
          <a class="src" href="${esc(m.src.url)}" target="_blank" rel="noopener" title="${esc(m.src.label)}">${Ti("Source", "출처")} ↗</a></div>
        <div class="txt">${T(m.text)}</div></div>`;
    }).join("");
    return `<div class="yr${evs.every((m) => !m.done) ? " ahead" : ""}"><h3>${y}</h3><div class="evs">${body}</div></div>`;
  }).join("");
  el.innerHTML = `
    <div>
      <div class="eyebrow">${Ti("Page 3 · Patent holder's timeline", "3페이지 · 특허권자 타임라인")}</div>
      <h1>${T(D.lede.timelineTitle)}</h1>
      <p class="lede">${T(D.lede.timeline)}</p>
      <div class="kf">${D.keyfacts.map((k) => `<div><span class="v">${T(k.value)}</span><span class="l">${T(k.label)}</span><span class="s">${T(k.sub)}</span></div>`).join("")}</div>
    </div>
    <div>
      <div class="section-h"><h2>${Ti("Patent clock", "특허 만료 타임라인")}</h2>
        <p>${T({ en: "Each bar runs from first filing to expiry.", ko: "막대는 최초 출원부터 만료까지입니다." })}</p></div>
      ${gantt}${table}
    </div>
    <div>
      <div class="section-h"><h2>${Ti(`${D.meta.originator.en}'s road map`, `${D.meta.originator.ko} 로드맵`)}</h2>
        <p>${T({ en: "Done in grey, planned in purple.", ko: "회색은 완료, 보라색은 계획입니다." })}</p></div>
      <div class="road">${road}</div>
    </div>`;
}

// ═════════ PAGE 4 — PK DATA ═════════
// an answer line, then (1) how the dose comes out by day and (2) how that compares with the weekly product
const KIND = { figure: ["Read from chart", "차트 판독"], simulated: ["Simulation", "시뮬레이션"], calc: ["Calculated", "계산값"] };
const kindTag = (k) => (KIND[k] ? `<span class="kind ${k}">${Ti(KIND[k][0], KIND[k][1])}</span>` : "");
const srcLinks = (src) => { const l = [].concat(src);
  return l.length === 1 ? `<a href="${esc(l[0].url)}" target="_blank" rel="noopener" title="${esc(l[0].label)}">${Ti("Source", "출처")} ↗</a>`
    : `${Ti("Sources", "출처")} ${l.map((x, i) => `<a href="${esc(x.url)}" target="_blank" rel="noopener" title="${esc(x.label)}">${i + 1} ↗</a>`).join(" ")}`; };

// the table's own measure over time, on one axis; series keep their table row index so row and line can light up together
// lines switched off in the table, per drug; kept while the page is re-rendered
const PKOFF = {};
// a round axis top and step for the largest value shown: 3 to 4 steps of 1, 1.5, 2, 2.5, 3 or 5 x a power of ten
function pkScale(m) {
  const e = 10 ** Math.floor(Math.log10(m / 3)), st = [1, 1.5, 2, 2.5, 3, 5, 10].map((k) => k * e).find((k) => Math.ceil(m / k) <= 4);
  const top = Math.ceil(m / st) * st, ticks = [];
  for (let v = 0; v <= top + st / 2; v += st) ticks.push(+v.toFixed(6));
  return { top, ticks };
}
function pkChart(X, w) {
  const narrow = w < 560, W = Math.round(Math.max(300, w)), H = narrow ? 200 : 230, l = 38, r = 10, t = 24, b = 22;
  const C = X.chart, off = PKOFF[DRUG] || new Set(), shown = X.rows.filter((row, i) => row.conc && !off.has(i));
  const S = shown.length ? pkScale(Math.max(...shown.flatMap((row) => row.conc.map(([, v]) => v)))) : { top: C.max, ticks: C.ticks };
  const step = X.tick * (narrow ? 2 : 1), x = (dd) => l + (W - l - r) * dd / X.axis, y = (v) => t + (H - t - b) * (1 - v / S.top);
  const path = (pts) => pts.map(([dd, v], i) => `${i ? "L" : "M"}${x(dd).toFixed(1)},${y(v).toFixed(1)}`).join("");
  const ticks = []; for (let dd = 0; dd < X.axis; dd += step) ticks.push(dd);
  // one line per row that has measured or calculated concentrations; data-row keeps the table link
  const series = X.rows.map((row, i) => row.conc && !off.has(i)
    ? `<g data-row="${i}" style="--c:var(--s${row.col})"><path class="ln" d="${path(row.conc)}"/>${row.conc.slice(1).map(([dd, v]) => `<circle class="pt" cx="${x(dd).toFixed(1)}" cy="${y(v).toFixed(1)}" r="2.6"/>`).join("")}<path class="hit" d="${path(row.conc)}"/></g>`
    : "").join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(`${C.yLabel.en} by day`)}">
    ${S.ticks.map((v) => `<line class="g" x1="${l}" x2="${W - r}" y1="${y(v)}" y2="${y(v)}"/><text x="${l - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`).join("")}
    <line class="ax" x1="${l}" x2="${W - r}" y1="${y(0)}" y2="${y(0)}"/>
    ${ticks.map((dd) => `<text x="${x(dd)}" y="${H - 5}" text-anchor="middle"${dd === X.target ? ' class="tg"' : ""}>${dd}</text>`).join("")}
    ${ticks.includes(X.target) ? "" : `<text x="${x(X.target)}" y="${H - 5}" text-anchor="middle" class="tg">${X.target}</text>`}
    <line class="tgl" x1="${x(X.target)}" x2="${x(X.target)}" y1="${t}" y2="${y(0)}"/>
    <text x="${l - 30}" y="${t - 12}">${esc(C.yLabel.en)}</text><text x="${W - r}" y="${y(0) - 6}" text-anchor="end">day</text>
    ${series}
  </svg>`;
}
// the chart is drawn at its box's real width (and redrawn when that changes), so its text stays at page size
function drawPK(el, X) {
  const box = $(".pkc", el);
  if (el._ro) el._ro.disconnect();
  const draw = () => {
    const w = box.clientWidth - 24;
    if (w < 200 || Math.abs(w - (box._w || 0)) < 8) return;
    box._w = w; box.innerHTML = pkChart(X, w) + `<p class="pkn">${Ti(X.chart.note.en, X.chart.note.ko)}</p>`;
  };
  el._ro = new ResizeObserver(draw); el._ro.observe(box); draw();
  el._redraw = () => { box._w = 0; draw(); };
}
// hovering a table row or a line lights up both; delegated, so redraws keep working
function linkPK(el) {
  if (el._linked) return;
  el._linked = true;
  const on = (i) => {
    const svg = $(".pkc svg", el);
    if (svg) svg.classList.toggle("focus", i != null);
    el.querySelectorAll("[data-row]").forEach((n) => n.classList.toggle("on", n.dataset.row === i));
  };
  el.addEventListener("pointerover", (e) => { const n = e.target.closest && e.target.closest(".pkc [data-row], .dt tr[data-row]"); on(n ? n.dataset.row : null); });
  el.addEventListener("pointerleave", () => on(null));
}

function renderPK() {
  const el = $("#p-pk"), P = D.pk, X = P.table;
  // one decimal below 10% (burst values), whole numbers above; a [lo, hi] pair is a range
  const fmt = (v) => (Array.isArray(v) ? `${Math.round(v[0])}–${Math.round(v[1])}%` : `${v < 10 && v % 1 ? v.toFixed(1) : Math.round(v)}%`);
  const mid = (v) => (Array.isArray(v) ? (v[0] + v[1]) / 2 : v);
  const keep = (day) => day === 1 || day === 7 || day === X.target;
  const cls = (day) => (day === X.target ? ' class="tg"' : keep(day) ? "" : ' class="opt"');
  const cell = (v, day, plain) => {
    const tg = cls(day);
    return v == null ? `<td${tg}><span class="nil">–</span></td>`
      : `<td${tg}><span class="v" style="--a:${plain ? 0 : Math.round(mid(v) * 0.22)}%">${fmt(v)}</span></td>`;
  };
  // Cmax / AUC: the number alone in the cell, its unit in the header; a time note or a "calculated" tag when there is one
  const metric = (r, m) => {
    const v = r && r[m.key];
    if (v == null) return `<td class="opt mt"><span class="nil">–</span></td>`;
    const at = r[`${m.key}At`], k = r[`${m.key}Kind`];
    return `<td class="opt mt">${Math.round(v).toLocaleString("en-US")}${at ? `<small>${Ti(at.en, at.ko)}</small>` : ""}${k ? `<small>${kindTag(k)}</small>` : ""}</td>`;
  };
  const opt = (v, c = "") => (v ? `<td${c}>${Ti(v.en, v.ko)}</td>` : `<td${c}><span class="nil">–</span></td>`);
  const sw = (r, guide) => `<span class="sw${guide ? " guide" : r.band ? " band" : r.col ? "" : " mute"}"${r.col ? ` style="--c:var(--s${r.col})"` : ""}></span>`;
  const off = PKOFF[DRUG] || (PKOFF[DRUG] = new Set());
  const ck = (r, i) => `<input type="checkbox" class="ck" data-i="${i}" style="--c:var(--s${r.col})"${off.has(i) ? "" : " checked"} aria-label="${esc(`Show ${r.name.en} on the chart`)}">`;
  const nameCell = (r, guide, i) => `<td>${!guide && r.conc ? ck(r, i) : sw(r, guide)}<span class="nm">${Ti(r.name.en, r.name.ko)}</span>${kindTag(r.kind)}${guide ? "" : `<span class="sb">${Ti(r.sub.en, r.sub.ko)} · ${srcLinks(r.src)}</span>`}</td>`;
  const row = (r, guide, i) => `<tr class="${guide ? "guide" : r.muted ? "muted" : ""}"${guide ? "" : ` data-row="${i}"`}>${nameCell(r, guide, i)}${X.days.map((dd, i) => cell(r.vals[i], dd, guide || r.muted)).join("")}
    ${X.endLabel ? opt(r.end) : ""}${(X.metrics || []).map((m) => metric(guide ? null : r, m)).join("")}</tr>`;
  const head = `<tr><th>${Ti("Formulation", "제형")}<small>${Ti("Tick to show on the chart", "체크하면 그래프에 표시")}</small></th>${X.days.map((dd) => `<th${cls(dd)}>${Ti(`Day ${dd}`, `${dd}일`)}${dd === 1 ? `<small>${Ti("burst", "초기 방출")}</small>` : dd === X.target ? `<small>${Ti("monthly target", "월 1회 목표")}</small>` : ""}</th>`).join("")}
    ${X.endLabel ? `<th>${Ti(X.endLabel.en, X.endLabel.ko)}</th>` : ""}${(X.metrics || []).map((m) => `<th class="opt mt">${Ti(m.label.en, m.label.ko)}<small>${esc(m.unit)}</small></th>`).join("")}</tr>`;
  const val = (v, en, ko, k) => (v ? `<div class="val"><span class="tl">${Ti(en, ko)}</span>${T(v)}${kindTag(k)}</div>` : `<div class="val nil">–</div>`);
  const cmp = (r) => `<div class="cmp-r${r.target ? " target" : ""}"><div><div class="nm">${Ti(r.name.en, r.name.ko)}</div><div class="sb">${Ti(r.sub.en, r.sub.ko)} · ${srcLinks(r.src)}</div></div>
    ${val(r.exp, "Exposure", "노출량", (r.kind || {}).exp)}${val(r.peak, "Peak", "최고농도", (r.kind || {}).peak)}</div>`;
  const groups = ["sib", "ref"].filter((g) => P.refs.some((r) => r.group === g));
  el.innerHTML = `
    <div>
      <div class="eyebrow">${Ti("Page 4 · PK data", "4페이지 · PK 데이터")}</div>
      <h1>${T(P.title)}</h1>
      <p class="pk-ans">${T(P.answer)}</p>
    </div>
    <div>
      <div class="section-h"><h2>${Ti(X.title.en, X.title.ko)}</h2><p>${T(X.sub)}</p></div>
      <div class="pkc"></div>
      <div class="dt-wrap"><table class="dt"><thead>${head}</thead><tbody>
        ${X.guide ? row(X.guide, true) : ""}${X.rows.map((r, i) => row(r, false, i)).join("")}
      </tbody></table></div>
      <p class="pk-none">${T(X.none)}</p>
    </div>
    <div>
      <div class="section-h"><h2>${Ti("Against the weekly product", "주 1회 제품과 비교")}</h2><p>${T(P.judge.text)} ${srcLinks(P.judge.src)}</p></div>
      <div class="cmp">
        <div class="cmp-h"><div>${Ti("Product", "제품")}</div><div>${Ti("Exposure vs reference", "기준 대비 노출량")}</div><div>${Ti("Peak", "최고농도")}</div></div>
        ${P.refs.filter((r) => r.target).map(cmp).join("")}
        ${groups.map((g) => `<div class="cmp-g">${Ti(P.refGroups[g].en, P.refGroups[g].ko)}</div>${P.refs.filter((r) => r.group === g).map(cmp).join("")}`).join("")}
      </div>
      <p class="pk-note">${T(P.caution.text)} ${srcLinks(P.caution.src)}</p>
    </div>`;
  drawPK(el, X);
  linkPK(el);
  el.onchange = (e) => {
    if (!e.target.matches(".ck")) return;
    off[e.target.checked ? "delete" : "add"](+e.target.dataset.i);
    el._redraw();
  };
}

// ═════════ PAGE 5 — NEWS ═════════
let nscope = "All", ntype = "All";
const TYPE = { Data: ["Data", "데이터"], Patent: ["Patent", "특허"], Deal: ["Deal", "계약"], Corporate: ["Corporate", "기업"],
  Trial: ["Trial", "임상"], Regulatory: ["Regulatory", "규제"], Market: ["Market", "시장"] };
function renderNews() {
  const el = $("#p-news");
  const list = D.news.filter((n) => (nscope === "All" || (nscope === "Korea" ? n.region === "KR" : n.region !== "KR")) && (ntype === "All" || n.type === ntype));
  let html = "", last = "";
  list.forEach((n) => {
    const [y, m] = n.date.split("-");
    const key = `${y}-${m || ""}`;
    if (key !== last) { html += `<div class="month">${m ? Ti(`${MONTHS[+m - 1]} ${y}`, `${y}년 ${+m}월`) : y}</div>`; last = key; }
    const ty = TYPE[n.type] || [n.type, n.type];
    html += `<div class="item"><div class="d">${n.date}</div><div class="t"><div class="tags"><span class="tag${n.region === "KR" ? " kr" : ""}">${n.region === "KR" ? Ti("Korea", "국내") : Ti("Global", "글로벌")}</span><span class="tag${n.type === "Patent" ? " pt" : ""}">${Ti(ty[0], ty[1])}</span></div>${T(n.text)}</div>
      <div class="s">${n.src ? `<a href="${esc(n.src.url)}" target="_blank" rel="noopener" title="${esc(n.src.label)}">${Ti("Source", "출처")} ↗</a>` : ""}</div></div>`;
  });
  const types = Object.keys(TYPE).filter((k) => D.news.some((n) => n.type === k));
  el.innerHTML = `
    <div>
      <div class="eyebrow">${Ti("Page 5 · News", "5페이지 · 뉴스")}</div>
      <h1>${T({ en: `Long-acting ${D.meta.name.en} news`, ko: `장기지속형 ${D.meta.name.ko} 뉴스` })}</h1>
      <p class="lede">${T({ en: `${D.news.length} dated events since Jan 2025, newest first, one sentence each. Patent publications are dated by publication, not priority.`,
        ko: `2025년 1월 이후 날짜별 이벤트 ${D.news.length}건, 최신순, 한 문장 요약. 특허는 우선일이 아닌 공개일 기준입니다.` })}</p>
      <div class="toolbar"><div class="tools">${segHtml("nscope", nscope, [["All", "All", "전체"], ["Korea", "Korea", "국내"], ["Global", "Global", "글로벌"]])}
        <select class="sel" id="ntype" aria-label="News type"><option value="All">All types · 전체 유형</option>${types.map((k) => `<option value="${k}"${ntype === k ? " selected" : ""}>${TYPE[k][0]} · ${TYPE[k][1]}</option>`).join("")}</select></div>
        <div class="legend"><span>${list.length} / ${D.news.length}</span></div></div>
    </div>
    <div class="news">${html || `<div class="empty" style="border:0">${Ti("No news for this filter", "해당 뉴스 없음")}</div>`}</div>`;
  $("#nscope", el).addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) { nscope = b.dataset.v; renderNews(); } });
  $("#ntype", el).addEventListener("change", (e) => { ntype = e.target.value; renderNews(); });
}

// ═════════ ROUTER ═════════
const PAGES = { competitors: renderCompetitors, patents: renderPatents, timeline: renderTimeline, pk: renderPK, news: renderNews };
let done = {};
function route() {
  const [a, b] = location.hash.slice(1).split("/");
  return DRUGS[a] ? [a, PAGES[b] ? b : "competitors"] : ["reta", PAGES[a] ? a : "competitors"];
}
function setDrug(key) {
  if (key === DRUG && done.__drug === key) return;
  DRUG = key; D = DRUGS[key]; done = { __drug: key };
  scope = tech = nscope = ntype = "All";
  document.querySelectorAll("#drug button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.d === key));
  document.querySelectorAll("nav a").forEach((a) => (a.href = `#${key}/${a.dataset.page}`));
  $("#tabTl").innerHTML = Ti(`${D.meta.originator.en} timeline`, `${D.meta.originator.ko} 타임라인`);
  $("#asof").innerHTML = `<span class="en">Data as of </span>${D.asOf}<span class="ko-inline">기준</span>`;
  document.title = `${cap(D.meta.name.en)} · Incretin LAI Radar`;
  $("#foot").innerHTML = T({ en: `${D.meta.foot.en} Patent expiry dates are estimates unless a grant states them. Research current to ${D.asOf}. Internal use only.`,
    ko: `${D.meta.foot.ko} 특허 만료일은 등록 문서에 명시되지 않은 경우 추정치입니다. ${D.asOf} 기준 조사. 내부용 자료.` });
}
function show() {
  const [drug, page] = route();
  setDrug(drug);
  Object.keys(PAGES).forEach((p) => ($(`#p-${p}`).hidden = p !== page));
  document.querySelectorAll("nav a").forEach((a) => (a.dataset.page === page ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current")));
  if (!done[page]) { PAGES[page](); done[page] = true; }
}
$("#drug").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-d]");
  if (b && b.dataset.d !== DRUG) location.hash = `${b.dataset.d}/${route()[1]}`;
});
addEventListener("hashchange", () => { show(); scrollTo({ top: 0 }); if (!$("#ask").hidden) askRender(); });
show();

// ═════════ ASK PANEL ═════════
// questions go to /api/ask, which adds this tracker's data and asks Google's Gemini (free tier); history lives only in this tab
const ASK = { turns: [], busy: false };
const isKo = () => document.documentElement.dataset.lang === "ko";
function askFmt(text) {
  // escape first, then the little formatting an answer may use: **bold**, "- " lines, links
  const inl = (t) => esc(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/https?:\/\/[^\s<)]+/g, (u) => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
  return text.split(/\n{2,}/).map((blk) => {
    const lines = blk.split("\n").filter((l) => l.trim());
    return lines.length && lines.every((l) => /^\s*[-*•]\s/.test(l))
      ? `<ul>${lines.map((l) => `<li>${inl(l.replace(/^\s*[-*•]\s/, ""))}</li>`).join("")}</ul>`
      : `<p>${lines.map(inl).join("<br>")}</p>`;
  }).join("");
}
const ASK_ERR = {
  not_configured: ["The assistant is not connected yet.", "질문 기능이 아직 연결되지 않았습니다."],
  quota: ["Today's free question allowance is used up. Please try again tomorrow.", "오늘의 무료 질문 한도를 다 썼습니다. 내일 다시 시도해 주세요."],
  busy: ["Too many questions in a minute. Please wait a moment.", "1분 내 질문이 너무 많습니다. 잠시 후 다시 시도해 주세요."],
  overloaded: ["Google's free AI is busy right now. Please try again in a minute.", "Google 무료 AI가 지금 혼잡합니다. 1분 후 다시 시도해 주세요."],
  blocked: ["No answer came back for that question. Try wording it differently.", "이 질문에는 답변이 없습니다. 다르게 질문해 보세요."],
  too_long: ["The answer ran too long. Try a narrower question.", "답변이 너무 깁니다. 질문 범위를 좁혀 주세요."],
  failed: ["Something went wrong. Please try again.", "문제가 생겼습니다. 다시 시도해 주세요."],
};
function askRender() {
  const ko = isKo();
  $("#askTitle").innerHTML = Ti("Ask the tracker", "트래커에 질문");
  $("#askClear").innerHTML = Ti("New chat", "새 대화");
  $("#askClear").hidden = !ASK.turns.length;
  $("#askSend").innerHTML = Ti("Send", "보내기");
  $("#askNote").innerHTML = T({ en: "Answered by Google's free AI (Gemini) from this tracker's data. It can be wrong: check the source it names. Google may read questions, so don't type confidential information.",
    ko: "이 트래커 데이터로 Google 무료 AI(Gemini)가 답합니다. 틀릴 수 있으니 출처를 확인하세요. Google이 질문을 볼 수 있으니 기밀 정보는 입력하지 마세요." });
  $("#askQ").placeholder = ko ? "용어나 질문을 입력하세요" : "Type a hard term or a question";
  const starters = [["What is the difference between Cmax and AUC?", "Cmax와 AUC의 차이는 무엇인가요?"],
    [`Who is closest to a monthly ${D.meta.name.en}?`, `월 1회 ${D.meta.name.ko}에 가장 가까운 곳은 어디인가요?`],
    ['What does "Calculated" mean on the PK page?', "PK 페이지의 '계산값'은 무슨 뜻인가요?"]];
  $("#askLog").innerHTML = ASK.turns.map((t) => `<div class="ask-m ${t.role === "user" ? "u" : "a"}${t.err && t.role !== "user" ? " err" : ""}">${t.role === "user" || t.err ? esc(t.text) : askFmt(t.text)}</div>`).join("")
    + (ASK.busy ? `<div class="ask-m a wait">${Ti("Thinking…", "답변 작성 중…")}</div>` : "")
    + (ASK.turns.length ? "" : `<div class="ask-st"><small>${Ti("Try one of these", "예시 질문")}</small>${starters.map(([en, k]) => `<button type="button" data-q="${esc(ko ? k : en)}">${esc(ko ? k : en)}</button>`).join("")}</div>`);
  $("#askLog").scrollTop = $("#askLog").scrollHeight;
  $("#askSend").disabled = ASK.busy;
}
async function askSend(q) {
  q = q.trim();
  if (!q || ASK.busy) return;
  const history = ASK.turns.filter((t) => !t.err).map(({ role, text }) => ({ role, text }));
  ASK.turns.push({ role: "user", text: q });
  ASK.busy = true; askRender();
  let reply;
  try {
    const r = await fetch("/api/ask", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ q, drug: DRUG, page: route()[1], history }) });
    const j = await r.json().catch(() => ({ error: r.status === 404 || r.status === 501 ? "not_configured" : "failed" }));
    if (j.answer) reply = { role: "model", text: j.answer };
    else reply = { role: "model", err: true, text: (ASK_ERR[j.error] || ASK_ERR.failed)[isKo() ? 1 : 0] };
  } catch (e) {
    reply = { role: "model", err: true, text: isKo() ? "연결할 수 없습니다. 인터넷 연결을 확인하세요." : "Could not reach the assistant. Check your connection." };
  }
  // a failed question stays on screen but is left out of what the next question sends
  if (reply.err) ASK.turns[ASK.turns.length - 1].err = true;
  ASK.turns.push(reply);
  ASK.busy = false; askRender();
}
function askOpen(open) {
  $("#ask").hidden = !open; $("#askBtn").hidden = open;
  $("#askBtn").setAttribute("aria-expanded", open);
  if (open) { askRender(); $("#askQ").focus(); } else $("#askBtn").focus();
}
$("#askBtn").addEventListener("click", () => askOpen(true));
$("#askClose").addEventListener("click", () => askOpen(false));
$("#askClear").addEventListener("click", () => { ASK.turns = []; askRender(); $("#askQ").focus(); });
$("#ask").addEventListener("keydown", (e) => { if (e.key === "Escape") askOpen(false); });
$("#askLog").addEventListener("click", (e) => { const b = e.target.closest("button[data-q]"); if (b) askSend(b.dataset.q); });
$("#askForm").addEventListener("submit", (e) => { e.preventDefault(); const q = $("#askQ").value; $("#askQ").value = ""; askSend(q); });
$("#askQ").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("#askForm").requestSubmit(); } });
$("#lang").addEventListener("click", () => { if (!$("#ask").hidden) askRender(); });

</script>
